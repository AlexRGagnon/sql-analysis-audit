[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-analysis-audit"
version = "0.1.0"
description = "Reproducible real-data SQL analysis with explicit analytical failure cases"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alex Gagnon"}]
dependencies = []

[project.optional-dependencies]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8"]

[project.scripts]
sql-analysis-audit = "sql_analysis_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sql_analysis_audit = ["data/*.csv", "data/*.json", "data/*.md", "sql/*.sql"]
